<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Attendance - IIT Project</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #333;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 22px;
        }

        .logout {
            color: white;
            text-decoration: none;

            background: #dc2626;

            padding: 9px 16px;

            border-radius: 6px;
        }

        .container {
            max-width: 900px;

            margin: 40px auto;

            padding: 0 20px;
        }

        .back-button {
            display: inline-block;

            margin-bottom: 25px;

            text-decoration: none;

            color: white;

            background: #4b5563;

            padding: 10px 18px;

            border-radius: 6px;
        }

        .back-button:hover {
            background: #374151;
        }

        .box {
            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 20px;
        }

        .coming {
            padding: 25px;

            background: #f3f4f6;

            border-radius: 8px;

            text-align: center;

            font-size: 18px;
        }

    </style>

</head>


<body>


<div class="header">

    <h1>
        ELV Management System
    </h1>

    <a
        href="{% url 'logout' %}"
        class="logout"
    >
        Logout
    </a>

</div>


<div class="container">


    <a
        href="{% url 'iit_project' %}"
        class="back-button"
    >
        ← Back to IIT Project
    </a>


    <div class="box">

        <h2>
            👥 Attendance
        </h2>

        <p>
            IIT Project Staff Attendance Management
        </p>

        <div class="coming">

            Attendance system will be added here.

        </div>

    </div>


</div>


</body>

</html>
