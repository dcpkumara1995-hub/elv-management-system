```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ELV Management System</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #333;
        }

        .header {
            background: #1f2937;
            color: white;

            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 22px;
        }

        .logout {
            color: white;
            text-decoration: none;

            background: #dc2626;

            padding: 9px 16px;

            border-radius: 6px;
        }

        .logout:hover {
            background: #b91c1c;
        }

        .container {
            max-width: 1100px;

            margin: 40px auto;

            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h2 {
            font-size: 28px;

            margin-bottom: 8px;
        }

        .welcome p {
            color: #666;
        }

        .project-card {
            display: block;

            background: white;

            padding: 35px;

            border-radius: 12px;

            text-decoration: none;

            color: #333;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);

            transition: 0.2s;
        }

        .project-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.12);
        }

        .project-icon {
            font-size: 50px;

            margin-bottom: 15px;
        }

        .project-card h3 {
            font-size: 24px;

            margin-bottom: 10px;
        }

        .project-card p {
            color: #777;

            font-size: 15px;
        }

        @media (max-width: 600px) {

            .header {
                padding: 15px 18px;
            }

            .header h1 {
                font-size: 18px;
            }

            .container {
                margin: 25px auto;
            }

            .welcome h2 {
                font-size: 24px;
            }

            .project-card {
                padding: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <h1>
            ELV Management System
        </h1>

        <a
            href="{% url 'logout' %}"
            class="logout"
        >
            Logout
        </a>

    </div>



    <!-- MAIN CONTAINER -->

    <div class="container">


        <!-- WELCOME -->

        <div class="welcome">

            <h2>
                Dashboard
            </h2>

            <p>
                Welcome, {{ request.user.username }}
            </p>

        </div>



        <!-- IIT PROJECT -->

        <a
            href="{% url 'iit_project' %}"
            class="project-card"
        >

            <div class="project-icon">
                🏢
            </div>

            <h3>
                IIT Project
            </h3>

            <p>
                Inventory and stock management system
            </p>

        </a>


    </div>


</body>

</html>
```
