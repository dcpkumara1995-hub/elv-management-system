<!DOCTYPE html>
<html>
<head>
    <title>Nimalka Attendance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 18px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background: #0d6efd;
            color: white;
            border: none;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 10px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>👷 Nimalka Attendance</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Date</label>
        <input type="date" name="attendance_date" required>

        <label>Attendance</label>
        <select name="worked" required>
            <option value="">Select</option>
            <option value="Present">Present</option>
            <option value="Absent">Absent</option>
            <option value="Half Day">Half Day</option>
        </select>

        <button type="submit">Save Attendance</button>
    </form>

    <a class="back" href="/attendance/">← Back to Attendance</a>

</div>

</body>
</html>
