```html
<!DOCTYPE html>
<html>
<head>

    <title>Chamara Attendance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 18px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background: #198754;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #157347;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 10px;
            text-decoration: none;
            color: #333;
        }

        .message {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            background: #d1e7dd;
            color: #0f5132;
        }

        .project-section {
            display: block;
        }

        .info {
            font-size: 13px;
            color: #666;
            margin-top: -10px;
            margin-bottom: 18px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>👨‍💻 Chamara Attendance</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Date</label>

        <input
            type="date"
            name="attendance_date"
            value="{{ today|date:'Y-m-d' }}"
            required
        >

        <label>Attendance</label>

        <select name="worked" id="worked" required onchange="attendanceChanged()">

            <option value="">Select Attendance</option>

            <option value="Present">
                Present
            </option>

            <option value="Absent">
                Absent
            </option>

            <option value="Half Day">
                Half Day
            </option>

        </select>

        <div id="projectSection" class="project-section">

            <label>Project</label>

            <select name="project" id="project">

                <option value="">
                    Select Project
                </option>

                <option value="IIT Project">
                    IIT Project
                </option>

                <option value="Other Project">
                    Other Project
                </option>

            </select>

            <div class="info">
                Project is required for Present / Half Day.
            </div>

        </div>

        <button type="submit">
            Save Attendance
        </button>

    </form>

    <a class="back" href="/attendance/">
        ← Back to Attendance
    </a>

</div>


<script>

function attendanceChanged() {

    const attendance = document.getElementById("worked").value;

    const projectSection =
        document.getElementById("projectSection");

    const project =
        document.getElementById("project");


    if (attendance === "Absent") {

        // Absent = no project required

        projectSection.style.display = "none";

        project.required = false;

        project.value = "";

    } else {

        // Present / Half Day = project required

        projectSection.style.display = "block";

        project.required = true;

    }
}

</script>

</body>
</html>
```
