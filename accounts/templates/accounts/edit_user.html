<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Edit User</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
        }

        .header {
            background: #212529;
            color: white;
            padding: 22px;
            border-radius: 14px 14px 0 0;
        }

        .header h2 {
            margin: 0 0 6px;
        }

        .header p {
            margin: 0;
            color: #ddd;
            font-size: 14px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 0 0 14px 14px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #0d6efd;
        }

        input[readonly] {
            background: #f1f3f5;
            color: #666;
        }

        .help {
            margin-top: 6px;
            color: #777;
            font-size: 12px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .btn-primary {
            background: #0d6efd;
            color: white;
            flex: 1;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            flex: 1;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .container {
                margin: 10px auto;
            }

            .card {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h2>
            ✏️ Edit User
        </h2>

        <p>
            Update user information.
        </p>

    </div>


    <!-- FORM -->

    <div class="card">


        <form method="POST">

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    value="{{ edit_user.username }}"
                    readonly
                >

                <div class="help">
                    Username cannot be changed from this page.
                </div>

            </div>


            <!-- FIRST NAME -->

            <div class="form-group">

                <label for="first_name">
                    First Name
                </label>

                <input
                    type="text"
                    id="first_name"
                    name="first_name"
                    value="{{ edit_user.first_name }}"
                    placeholder="Enter first name"
                >

            </div>


            <!-- LAST NAME -->

            <div class="form-group">

                <label for="last_name">
                    Last Name
                </label>

                <input
                    type="text"
                    id="last_name"
                    name="last_name"
                    value="{{ edit_user.last_name }}"
                    placeholder="Enter last name"
                >

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <a
                    href="{% url 'user_management' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Changes
                </button>

            </div>


        </form>


    </div>


    <div class="footer">

        ELV Management System
        &copy; 2026

    </div>


</div>


</body>

</html>
