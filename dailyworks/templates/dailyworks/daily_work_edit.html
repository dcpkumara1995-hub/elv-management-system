<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Edit Daily Work</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            margin: 0 0 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            margin-bottom: 20px;
        }

        input {
            height: 48px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #198754;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #157347;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #333;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .message {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            background: #f8d7da;
            color: #842029;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 18px;
                border-radius: 12px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h2>✏️ Edit Daily Work</h2>

    <div class="subtitle">
        IIT Project
    </div>


    {% if messages %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <label for="date">
            Date
        </label>

        <input
            type="date"
            id="date"
            name="date"
            value="{{ daily_work.date|date:'Y-m-d' }}"
            required
        >


        <label for="work">
            Work Description
        </label>

        <textarea
            id="work"
            name="work"
            required
        >{{ daily_work.work }}</textarea>


        <button
            type="submit"
            class="save-btn"
        >
            Save Changes
        </button>

    </form>


    <a
        href="{% url 'daily_work_list' %}"
        class="back"
    >
        ← Back to Daily Works
    </a>

</div>

</body>

</html>
