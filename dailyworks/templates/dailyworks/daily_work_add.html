<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Add Daily Work</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin: 0 0 8px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input[type="date"],
        textarea {
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 9px;
            padding: 12px;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        input[type="date"] {
            height: 48px;
            margin-bottom: 22px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .work-item {
            position: relative;
            margin-bottom: 15px;
        }

        .remove-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: #dc3545;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: none;
        }

        .remove-btn:hover {
            background: #bb2d3b;
        }

        .add-btn {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 18px;
            border: 1px dashed #198754;
            border-radius: 9px;
            background: #f1fff7;
            color: #198754;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #e2f7eb;
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #198754;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #157347;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #333;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .message {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            background: #f8d7da;
            color: #842029;
        }

        .hint {
            margin-top: -15px;
            margin-bottom: 20px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 18px;
                border-radius: 12px;
            }

            h2 {
                font-size: 22px;
            }

            textarea {
                min-height: 100px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h2>📝 Add Daily Work</h2>

    <div class="subtitle">
        IIT Project
    </div>


    {% if messages %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <label for="date">
            Date
        </label>

        <input
            type="date"
            id="date"
            name="date"
            required
        >


        <label>
            Work Description
        </label>

        <div id="workContainer">

            <div class="work-item">

                <textarea
                    name="work"
                    placeholder="Enter work description..."
                    required
                ></textarea>

                <button
                    type="button"
                    class="remove-btn"
                    onclick="removeWork(this)"
                >
                    ×
                </button>

            </div>

        </div>


        <div class="hint">
            You can add multiple work items for the same date.
        </div>


        <button
            type="button"
            class="add-btn"
            onclick="addWork()"
        >
            + Add Another Work
        </button>


        <button
            type="submit"
            class="save-btn"
        >
            Save Daily Work
        </button>

    </form>


    <a
        href="{% url 'daily_work_list' %}"
        class="back"
    >
        ← Back to Daily Works
    </a>

</div>


<script>

function addWork() {

    const container =
        document.getElementById("workContainer");

    const item =
        document.createElement("div");

    item.className = "work-item";

    item.innerHTML = `
        <textarea
            name="work"
            placeholder="Enter work description..."
            required
        ></textarea>

        <button
            type="button"
            class="remove-btn"
            onclick="removeWork(this)"
        >
            ×
        </button>
    `;

    container.appendChild(item);

    updateRemoveButtons();

    item.querySelector("textarea").focus();
}


function removeWork(button) {

    const item =
        button.parentElement;

    item.remove();

    updateRemoveButtons();
}


function updateRemoveButtons() {

    const items =
        document.querySelectorAll(".work-item");

    items.forEach(function(item, index) {

        const button =
            item.querySelector(".remove-btn");

        if (items.length > 1) {

            button.style.display = "block";

        } else {

            button.style.display = "none";

        }

    });

}

</script>

</body>

</html>
